- name: state_distinct_counts
  model: mart_fraud_by_state
  given:
  - input: ref('stg_transactions')
    rows:
    - state: CA
      customer_id: a
      merchant: shop
      amount: 10
      target: 0
    - state: CA
      customer_id: a
      merchant: shop
      amount: 20
      target: 1
    - state: DC
      customer_id: b
      merchant: shop2
      amount: 50
      target: 0
  expect:
    rows:
    - state: CA
      customers: 1
      merchants: 1
      transactions: 2
      frauds: 1
      total_amount: 30
      fraud_amount: 20
      fraud_rate: 50
    - state: DC
      customers: 1
      merchants: 1
      transactions: 1
      frauds: 0
      total_amount: 50
      fraud_amount: 0
      fraud_rate: 0
- name: hour_groups
  model: mart_hourly_fraud_pattern
  given:
  - input: ref('stg_transactions')
    rows:
    - day_of_week: 1
      transaction_hour: 2
      target: 1
      amount: 30
    - day_of_week: 1
      transaction_hour: 2
      target: 0
      amount: 70
    - day_of_week: 7
      transaction_hour: 2
      target: 0
      amount: 20
  expect:
    rows:
    - day_of_week: 1
      transaction_hour: 2
      transactions: 2
      frauds: 1
      fraud_rate: 50
      total_amount: 100
    - day_of_week: 7
      transaction_hour: 2
      transactions: 1
      frauds: 0
      fraud_rate: 0
      total_amount: 20
- name: merchant_threshold
  model: mart_merchant_analytics
  given:
  - input: ref('stg_transactions')
    format: sql
    fixture: merchant
  expect:
    rows:
    - merchant: normal
      fraud_rate: 0
      suspicious: 0
    - merchant: border
      fraud_rate: 5
      suspicious: 1
