version: 2
unit_tests:
- name: category_totals
  model: mart_fraud_by_category
  given:
  - input: ref('stg_transactions')
    rows:
    - category: food
      amount: 100
      target: 0
    - category: food
      amount: 300
      target: 1
    - category: travel
      amount: 50
      target: 0
  expect:
    rows:
    - category: food
      transactions: 2
      frauds: 1
      fraud_rate: 50
      total_amount: 400
      fraud_amount: 300
    - category: travel
      transactions: 1
      frauds: 0
      fraud_rate: 0
      total_amount: 50
      fraud_amount: 0
- name: daily_metrics
  model: mart_daily_state_metrics
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_date: '2020-01-01'
      state: CA
      amount: 100
      amount_group: MEDIUM
    - transaction_date: '2020-01-01'
      state: CA
      amount: 1000
      amount_group: LARGE
  expect:
    rows:
    - transaction_date: '2020-01-01'
      state: CA
      transactions: 2
      total_amount: 1100
      average_amount: 550
      p95_amount: 1000
      large_share: 50
- name: risk_boundaries
  model: mart_customer_risk_profile
  given:
  - input: ref('stg_transactions')
    format: sql
    fixture: risk
  expect:
    rows:
    - customer_id: low
      risk_level: LOW
      fraud_rate: 0
    - customer_id: medium
      risk_level: MEDIUM
      fraud_rate: 1
    - customer_id: high
      risk_level: HIGH
      fraud_rate: 5
